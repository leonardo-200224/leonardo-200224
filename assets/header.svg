<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Leonardo Ayala, Software Developer and Systems Engineering">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#4D7CFF"/>
      <stop offset=".6" stop-color="#3FD0FF"/>
      <stop offset="1" stop-color="#B8F2FF"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4D7CFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#4D7CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1C2742"/>
    </pattern>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="marco"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .pista{fill:none;stroke:#1A2A52;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .pulso{fill:none;stroke:#3FD0FF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18 600;stroke-dashoffset:618;animation:corre 3.2s linear infinite}
      .pulso.p2{animation-delay:1.1s;animation-duration:4s}
      .pulso.p3{stroke:#F5C542;animation-delay:2s;animation-duration:3.6s}
      .pulso.p4{animation-delay:.5s;animation-duration:4.4s}
      .pad{fill:#05060A;stroke:#2C4A9A;stroke-width:2}
      @keyframes corre{to{stroke-dashoffset:0}}

      .logo-pista{fill:none;stroke:url(#grad);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .logo-pulso{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 93;stroke-dashoffset:100;animation:logo 2.8s linear infinite}
      @keyframes logo{to{stroke-dashoffset:0}}

      .nombre{font:800 64px 'Segoe UI','Helvetica Neue',Ubuntu,Arial,sans-serif;letter-spacing:-2px}
      .rol{font:500 20px Consolas,'SF Mono','Cascadia Code',Menlo,monospace;fill:#3FD0FF}
      .linea{font:400 19px Consolas,'SF Mono','Cascadia Code',Menlo,monospace;fill:#9BA4B7;opacity:0;animation:frase 12s infinite}
      .linea.l2{animation-delay:4s}.linea.l3{animation-delay:8s}
      @keyframes frase{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-8px)}}
      .cursor{fill:#3FD0FF;animation:parpadea 1s steps(1) infinite}
      @keyframes parpadea{50%{opacity:0}}

      .volt{animation:flota 3.6s ease-in-out infinite}
      @keyframes flota{50%{transform:translateY(-10px)}}
      .ojo{transform-box:fill-box;transform-origin:center;animation:pestanea 4.5s infinite}
      @keyframes pestanea{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .bombillo{animation:late 1.6s ease-in-out infinite}
      @keyframes late{50%{opacity:.55}}
      .llama{transform-box:fill-box;transform-origin:top;animation:fuego .18s ease-in-out infinite alternate}
      @keyframes fuego{to{transform:scaleY(1.35)}}
      .pecho{animation:late 2.2s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.linea.l1{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1200" height="320" fill="#05060A"/>
    <rect width="1200" height="320" fill="url(#puntos)"/>

    <!-- Pistas del circuito -->
    <path class="pista" d="M600 330V250l40-40h160l30-30h90"/>
    <path class="pista" d="M1210 60h-120l-40 40h-80l-30 30"/>
    <path class="pista" d="M1210 270h-150l-30-30h-60"/>
    <path class="pista" d="M700 -10v60l30 30h110"/>
    <path class="pista" d="M520 330v-40l30-30h70"/>
    <path class="pulso" d="M600 330V250l40-40h160l30-30h90"/>
    <path class="pulso p2" d="M1210 60h-120l-40 40h-80l-30 30"/>
    <path class="pulso p3" d="M1210 270h-150l-30-30h-60"/>
    <path class="pulso p4" d="M700 -10v60l30 30h110"/>
    <circle class="pad" cx="920" cy="180" r="6"/>
    <circle class="pad" cx="930" cy="130" r="6"/>
    <circle class="pad" cx="970" cy="240" r="6"/>
    <circle class="pad" cx="840" cy="80" r="6"/>
    <circle class="pad" cx="620" cy="260" r="6"/>

    <!-- Logo LA -->
    <g transform="translate(64 44)">
      <path class="logo-pista" pathLength="100" d="M6 5V31H27L38 5L49 31"/>
      <path class="logo-pista" d="M32.5 20H43.5"/>
      <path class="logo-pulso" pathLength="100" d="M6 5V31H27L38 5L49 31"/>
      <circle cx="6" cy="5" r="3" fill="#05060A" stroke="#3FD0FF" stroke-width="1.8"/>
      <circle cx="49" cy="31" r="3" fill="#05060A" stroke="#3FD0FF" stroke-width="1.8"/>
      <text x="70" y="25" style="font:500 17px Consolas,'SF Mono',Menlo,monospace" fill="#ECEFF6">leonardo<tspan fill="#3FD0FF">.</tspan>ayala</text>
    </g>

    <!-- Nombre y rol -->
    <text x="64" y="168" class="nombre"><tspan fill="#ECEFF6">Leonardo </tspan><tspan fill="url(#grad)">Ayala</tspan></text>
    <text x="66" y="210" class="rol">Software Developer · Systems Engineering</text>
    <g transform="translate(66 252)">
      <text class="linea l1">&gt; building APIs with Node.js, TypeScript &amp; NestJS</text>
      <text class="linea l2">&gt; automating manual processes for real companies</text>
      <text class="linea l3">&gt; backend · databases · automation · Colombia</text>
    </g>

    <!-- Volt -->
    <ellipse cx="1040" cy="190" rx="130" ry="110" fill="url(#halo)"/>
    <g class="volt">
      <g transform="translate(985 58)">
        <line x1="70" y1="8" x2="70" y2="30" stroke="#8E99B0" stroke-width="4"/>
        <circle class="bombillo" cx="70" cy="7" r="8" fill="#F5C542" filter="url(#brillo)"/>
        <rect x="8" y="30" width="104" height="86" rx="28" fill="#F1F4FA"/>
        <rect x="-4" y="58" width="14" height="28" rx="6" fill="#0A0F1A"/>
        <rect x="110" y="58" width="14" height="28" rx="6" fill="#0A0F1A"/>
        <rect x="20" y="42" width="80" height="62" rx="16" fill="#071019"/>
        <g filter="url(#brillo)" fill="#62EEFF">
          <rect class="ojo" x="38" y="56" width="13" height="20" rx="6"/>
          <rect class="ojo" x="69" y="56" width="13" height="20" rx="6"/>
          <path d="M50 88q10 8 20 0" fill="none" stroke="#62EEFF" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <rect x="52" y="116" width="16" height="10" fill="#8E99B0"/>
        <rect x="26" y="124" width="68" height="54" rx="20" fill="#F1F4FA"/>
        <circle class="pecho" cx="60" cy="150" r="10" fill="none" stroke="#3FD0FF" stroke-width="3.5" filter="url(#brillo)"/>
        <rect x="12" y="132" width="13" height="34" rx="6.5" fill="#F1F4FA"/>
        <circle cx="18" cy="170" r="8" fill="#0A0F1A"/>
        <rect x="95" y="132" width="13" height="34" rx="6.5" fill="#F1F4FA"/>
        <circle cx="102" cy="170" r="8" fill="#0A0F1A"/>
        <path d="M48 178h24l-3 8h-18z" fill="#8E99B0"/>
        <path class="llama" d="M51 186h18l-9 26z" fill="#3FD0FF" filter="url(#brillo)"/>
      </g>
    </g>
    <rect x=".5" y=".5" width="1199" height="319" rx="19.5" fill="none" stroke="#1C2742"/>
  </g>
</svg>
